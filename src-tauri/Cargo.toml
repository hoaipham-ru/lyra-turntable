[package]
name = "turntable"
version = "0.3.0"
description = "Classic turntable front-end for foobar2000 (via Beefweb)"
edition = "2021"

[lib]
name = "turntable_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Encodes embedded cover art as a base64 `data:` URL for `artwork_read`.
base64 = "0.22"

# Native playback engine (P4). These let the webview drive lyra-engine end to end.
lyra-core = { path = "../crates/lyra-core" }
lyra-output = { path = "../crates/lyra-output" }
lyra-engine = { path = "../crates/lyra-engine" }
# Backs the playlist/tag/artwork commands in src/library.rs (Playlists store,
# read_tags, artwork), wired to the real API in P4.3.
lyra-library = { path = "../crates/lyra-library" }

# NOTE: the `[profile.release]` section moved to the workspace root Cargo.toml.
# Profiles declared in a workspace member are ignored (with a warning), so it
# must live at the root to take effect.
