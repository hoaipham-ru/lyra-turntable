[package]
name = "lyra-probe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lyra QA probe: decode/hash/compare CLI for foobar2000 parity testing (S09)."

[[bin]]
name = "lyra-probe"
path = "src/main.rs"

[dependencies]
lyra-core = { path = "../../crates/lyra-core" }
lyra-decode = { path = "../../crates/lyra-decode" }
lyra-dsd = { path = "../../crates/lyra-dsd" }
lyra-library = { path = "../../crates/lyra-library" }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hex = "0.4"

# `mute` drives the endpoint volume/mute API (IAudioEndpointVolume), which does
# not touch the digital render stream, so a muted render still taps bit-exact
# bytes (RUNBOOK Sound rule). Windows-only; aligned with lyra-output's 0.57.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.57", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
] }
