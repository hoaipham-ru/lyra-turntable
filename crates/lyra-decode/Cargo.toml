[package]
name = "lyra-decode"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "S02 — Lyra decode: native-PCM FLAC/WAV decoding (symphonia), cross-checked against libFLAC."

[features]
# OFF by default: the normal build has no external dependency. When enabled,
# tests may cross-check the symphonia FLAC path against the `flac` CLI (libFLAC).
libflac-check = []

[dependencies]
lyra-core = { path = "../lyra-core" }
# flac/wav/pcm are the parity-tested 1.0 formats. mp3/aac/alac/isomp4/ogg/vorbis/aiff were
# enabled early (1.0.1) so common files play; their P1b parity tests are still pending.
symphonia = { version = "0.5", default-features = false, features = ["flac", "wav", "pcm", "mp3", "aac", "alac", "isomp4", "ogg", "vorbis", "aiff"] }

[dev-dependencies]
